{% extends 'base.html' %}
{% block title %}Ad Generator | AdPulse{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto py-12">
  <h1 class="text-3xl font-semibold text-center mb-8">Generate AI-Powered Ad Copy</h1>
  <form method="post" class="bg-white p-8 shadow-lg rounded-xl space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-gray-700">Product Name</label>
      <input type="text" name="product_name" class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500" required>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Target Audience</label>
      <textarea name="audience" rows="3" class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500" required></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Tone of Voice</label>
      <select name="tone" class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
        <option value="Professional">Professional</option>
        <option value="Friendly">Friendly</option>
        <option value="Persuasive">Persuasive</option>
        <option value="Playful">Playful</option>
      </select>
    </div>

    <button type="submit" class="w-full bg-indigo-600 text-white p-3 rounded-md hover:bg-indigo-700">Generate Copy</button>
  </form>
</div>
{% endblock %}
