{% extends 'base.html' %}
{% block title %}Login | AdPulse{% endblock %}
{% block content %}
<div class="flex items-center justify-center h-[80vh]">
    <div class="bg-white p-8 shadow-lg rounded-xl w-full max-w-md">
        <h2 class="text-2xl font-semibold text-center mb-6">Welcome Back</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Email" class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500" required>
            <input type="password" name="password" placeholder="Password" class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500" required>
            <button type="submit" class="w-full bg-indigo-600 text-white p-3 rounded-md hover:bg-indigo-700">Login</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-500">Don’t have an account? 
            <a href="{% url 'register' %}" class="text-indigo-600 hover:underline">Register</a>
        </p>
    </div>
</div>
{% endblock %}
