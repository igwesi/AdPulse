{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{% block title %}AdPulse{% endblock %}</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="{% static 'css/main.css' %}">
        {% tailwind_css %}
    </head>

    <body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
                <!-- Navbar -->
        <nav class="bg-white shadow-md">
            <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-semibold text-indigo-600">AdPulse</a>
            <div class="space-x-6">
                <a href="{% url 'dashboard_home' %}" class="hover:text-indigo-600">Dashboard</a>
                <a href="{% url 'generator_home' %}" class="hover:text-indigo-600">Generator</a>
                <a href="{% url 'profile' %}" class="hover:text-indigo-600">Profile</a>
            </div>
            </div>
        </nav>

        {% if messages %}
        <div class="toast toast-top toast-end">
            {% for message in messages %}
            <div class="alert alert-info">
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <main class="flex-grow">
            {% block content %}{% endblock %}
        </main>

        <footer class="bg-gray-100 text-center py-4 mt-10">
            <p class="text-sm text-gray-500">&copy; 2025 AdPulse — AI-Powered Ad Copy Generator</p>
        </footer>
    </body>
</html>
